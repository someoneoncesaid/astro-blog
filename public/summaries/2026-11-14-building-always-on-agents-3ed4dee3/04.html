<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>事件收件箱</title>

<style>
html,body{margin:0;padding:0;overflow:hidden;background:transparent}
#xhs-card{position:relative;width:1080px;height:1440px;overflow:hidden;transform-origin:top left}
</style>

<style>
body{margin:0;background:#F7F4EE}
/* ---------- card system ---------- */
.card{position:relative;width:1080px;height:1440px;background:#F7F4EE;color:#17171A;overflow:hidden;font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.card .pad{position:absolute;inset:0;padding:76px 96px 60px 80px;display:flex;flex-direction:column}
.card .pad > *{flex:none}
.kick{display:flex;justify-content:space-between;align-items:baseline;font-size:20px;letter-spacing:.14em;color:#6E6A5E;font-variant-numeric:tabular-nums}
.kick .b{font-weight:600;color:#17171A;letter-spacing:.10em}
.rule{height:1px;background:#DCD5C6;margin-top:18px;flex:none}
.eyebrow{margin-top:40px;font-size:21px;letter-spacing:.16em;color:#C05200;font-weight:700}
.h1{margin:16px 0 0;font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;font-weight:700;font-size:64px;line-height:1.28;letter-spacing:-.01em}
.h1 em{font-style:normal;color:#C05200}
.deck{margin:24px 0 0;font-size:29px;line-height:1.72;color:#3F3C37;max-width:860px;letter-spacing:.005em}
.panel{margin-top:34px;background:#FFFDF8;border:1px solid #DCD5C6;border-radius:3px}
.panel svg{display:block;width:100%;height:auto}
.panel text{font-family:"PingFang SC","Hiragino Sans GB",system-ui,sans-serif}
.fig{margin-top:34px;background:#fff;border:1px solid #E3DCCB;border-radius:3px;overflow:hidden;padding:16px}
.fig img,.fig svg{display:block;width:100%;height:auto}
.figcap{margin-top:12px;font-size:18px;color:#8A8578;letter-spacing:.02em}
.code{margin-top:32px;background:#1E1A16;border-radius:3px;padding:30px 34px;color:#EADFCF}
.code pre{margin:0;font-family:"SF Mono",Menlo,"JetBrains Mono",monospace;font-size:20px;line-height:1.72;white-space:pre;overflow:hidden}
.code .k{color:#F0A46A}
.code .c{color:#9B8E7F}
.code .s{color:#E7C08A}
.note{margin-top:auto;padding-top:24px;font-size:22px;line-height:1.62;color:#5F5B52}
.note strong{color:#17171A;font-weight:600}
.chips{display:flex;gap:22px;margin-top:26px}
.chips .chip{flex:1;border-top:2px solid #C05200;padding-top:12px}
.chips .chip b{display:block;font-size:20px;margin-bottom:4px;color:#17171A}
.chips .chip span{font-size:18px;line-height:1.6;color:#6E6A5E;display:block}
.map{margin-top:24px;display:flex;flex-direction:column}
.map .row{display:flex;align-items:baseline;gap:26px;padding:13px 0;border-top:1px solid #E2DBCB}
.map .row:last-child{border-bottom:1px solid #E2DBCB}
.map b{flex:none;width:196px;font-size:21px;font-weight:600;color:#17171A}
.map span{font-size:20px;color:#6E6A5E}
.map span i{font-style:normal;font-family:"SF Mono",Menlo,monospace;font-size:19px;color:#C05200}
.steps{margin-top:22px;display:flex;flex-direction:column;gap:0}
.steps .row{display:flex;gap:18px;align-items:baseline;padding:15px 0;border-top:1px solid #E2DBCB}
.steps .row:first-child{border-top:0}
.steps .n{flex:none;width:34px;height:34px;border-radius:50%;background:#C05200;color:#FFFDF8;font-size:17px;line-height:34px;text-align:center}
.steps .t{font-size:20px;line-height:1.6;color:#17171A}
.steps .t code{font-family:"SF Mono",Menlo,monospace;font-size:18px;color:#C05200}
.rail{display:flex;align-items:center;margin-top:16px}
.rail span{flex:1;position:relative;padding-left:16px;font-size:18px;letter-spacing:.06em;color:#B5AE9E}
.rail span::before{content:"";position:absolute;left:0;top:50%;width:5px;height:5px;border-radius:50%;background:#CFC7B6;transform:translateY(-50%)}
.rail span.on{color:#C05200;font-weight:600}
.rail span.on::before{background:#C05200;width:7px;height:7px}
.foot{margin-top:20px;padding-top:18px;border-top:1px solid #DCD5C6;display:flex;justify-content:space-between;gap:24px;font-size:19px;color:#8A8578;letter-spacing:.03em}
.mark{position:absolute;top:104px;right:26px;writing-mode:vertical-rl;font-size:13px;letter-spacing:.34em;color:rgba(0,47,167,.20);font-family:"Helvetica Neue",Arial,sans-serif}
</style>

</head>
<body>
<div id="xhs-card">

<article class="card">
  <span class="mark">SOMEONE ONCE SAID</span>
  <div class="pad">
    <div class="kick"><span><span class="b">常驻 AGENT</span> · 后端实现</span><span>03 / 09</span></div>
    <div class="rule"></div>
    <div class="eyebrow">组件 01 · 事件收件箱</div>
    <h1 class="h1" style="font-size:60px">先用一张表挡住事件</h1>
    <div class="fig">
      <svg viewBox="103.7 83.9 1274.1 1121.7" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" preserveAspectRatio="xMidYMid meet" role="img" aria-label="事件收件箱：处理器写入、表去重、工作进程取事件" style="width:100%;height:auto;aspect-ratio:1274/1122"><defs><marker id="ar-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 1 L11 6 L0 11 Z" fill="#D55E00"></path></marker><marker id="ar-ink" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 1 L11 6 L0 11 Z" fill="#1F1F1E"></path></marker></defs><rect width="1440" height="1260" fill="#FFFFFF"></rect><text x="120" y="208" font-size="32" font-weight="400" fill="#6E6A5E" text-anchor="start">事件</text><line x1="232" y1="218" x2="520" y2="218" stroke="#1F1F1E" stroke-width="4" marker-end="url(#ar-ink)"></line><rect x="540" y="100" width="420" height="156" rx="12" fill="#FFFFFF" stroke="#DCD5C6" stroke-width="2"></rect><text x="750" y="172" font-size="38" font-weight="600" fill="#1F1F1E" text-anchor="middle">处理器</text><text x="750" y="218" font-size="26" font-weight="400" fill="#6E6A5E" text-anchor="middle">HTTP 端点</text><line x1="750" y1="256" x2="750" y2="336" stroke="#D55E00" stroke-width="4" marker-end="url(#ar-orange)"></line><text x="782" y="312" font-size="30" font-weight="400" fill="#D55E00" text-anchor="start">1. 写入事件</text><rect x="320" y="340" width="900" height="620" rx="16" fill="#F1EFE8" stroke="none" stroke-width="0"></rect><text x="370" y="408" font-size="38" font-weight="600" fill="#D55E00" text-anchor="start">事件收件箱</text><text x="628" y="408" font-size="26" font-weight="400" fill="#6E6A5E" text-anchor="start">数据库表</text><text x="370" y="470" font-size="24" font-weight="400" fill="#6E6A5E" text-anchor="start">时间</text><text x="476" y="470" font-size="24" font-weight="400" fill="#6E6A5E" text-anchor="start">事件</text><text x="980" y="470" font-size="24" font-weight="400" fill="#6E6A5E" text-anchor="start">会话</text><text x="1158" y="470" font-size="24" font-weight="400" fill="#6E6A5E" text-anchor="end">状态</text><rect x="360" y="496" width="820" height="92" rx="8" fill="#FFFFFF" stroke="#DCD5C6" stroke-width="2"></rect><text x="392" y="553" font-size="27" font-weight="400" fill="#1F1F1E" text-anchor="start">09:00</text><text x="496" y="553" font-size="27" font-weight="400" fill="#1F1F1E" text-anchor="start">记录发生变更</text><text x="980" y="553" font-size="25" font-weight="400" fill="#6E6A5E" text-anchor="start">–</text><text x="1158" y="553" font-size="25" font-weight="400" fill="#6E6A5E" text-anchor="end">已完成</text><rect x="360" y="608" width="820" height="92" rx="8" fill="#FFFFFF" stroke="#DCD5C6" stroke-width="2" stroke-dasharray="8 10"></rect><text x="392" y="665" font-size="27" font-weight="400" fill="#1F1F1E" text-anchor="start">09:00</text><text x="496" y="665" font-size="27" font-weight="400" fill="#6E6A5E" text-anchor="start">同一 ID 重复投递</text><text x="980" y="665" font-size="25" font-weight="400" fill="#6E6A5E" text-anchor="start">–</text><text x="1158" y="665" font-size="25" font-weight="400" fill="#6E6A5E" text-anchor="end">已丢弃</text><rect x="360" y="720" width="820" height="92" rx="8" fill="#FFFFFF" stroke="#D55E00" stroke-width="3"></rect><text x="392" y="777" font-size="27" font-weight="400" fill="#1F1F1E" text-anchor="start">14:02</text><text x="496" y="777" font-size="27" font-weight="400" fill="#1F1F1E" text-anchor="start">后台作业完成</text><text x="980" y="777" font-size="25" font-weight="400" fill="#6E6A5E" text-anchor="start">聊天 ID</text><text x="1158" y="777" font-size="25" font-weight="600" fill="#D55E00" text-anchor="end">待处理</text><rect x="360" y="832" width="820" height="92" rx="8" fill="#FFFFFF" stroke="#D55E00" stroke-width="3"></rect><text x="392" y="889" font-size="27" font-weight="400" fill="#1F1F1E" text-anchor="start">14:05</text><text x="496" y="889" font-size="27" font-weight="400" fill="#1F1F1E" text-anchor="start">用户发来消息</text><text x="980" y="889" font-size="25" font-weight="400" fill="#6E6A5E" text-anchor="start">聊天 ID</text><text x="1158" y="889" font-size="25" font-weight="600" fill="#D55E00" text-anchor="end">待处理</text><path d="M600,256 L600,282 L180,282 L180,1064 L320,1064" fill="none" stroke="#D55E00" stroke-width="3" stroke-dasharray="10 12" marker-end="url(#ar-orange)"></path><text x="200" y="640" font-size="30" font-weight="400" fill="#D55E00" text-anchor="start">2. 唤醒</text><text x="200" y="682" font-size="30" font-weight="400" fill="#D55E00" text-anchor="start">工作进程</text><line x1="470" y1="960" x2="470" y2="1026" stroke="#D55E00" stroke-width="4" marker-end="url(#ar-orange)"></line><text x="496" y="992" font-size="26" font-weight="400" fill="#D55E00" text-anchor="start">3. 读取事件</text><rect x="330" y="1030" width="400" height="160" rx="12" fill="#FFFFFF" stroke="#DCD5C6" stroke-width="2"></rect><text x="530" y="1108" font-size="36" font-weight="600" fill="#1F1F1E" text-anchor="middle">工作进程</text><text x="530" y="1154" font-size="27" font-weight="400" fill="#6E6A5E" text-anchor="middle">后台服务</text><rect x="960" y="1030" width="400" height="160" rx="12" fill="#FFFFFF" stroke="#DCD5C6" stroke-width="2"></rect><text x="1160" y="1108" font-size="36" font-weight="600" fill="#1F1F1E" text-anchor="middle">一次运行</text><text x="1160" y="1154" font-size="27" font-weight="400" fill="#6E6A5E" text-anchor="middle">Agent 循环</text><line x1="738" y1="1088" x2="950" y2="1088" stroke="#D55E00" stroke-width="4" marker-end="url(#ar-orange)"></line><text x="750" y="1066" font-size="27" font-weight="400" fill="#D55E00" text-anchor="start">4. 启动运行</text><line x1="950" y1="1142" x2="738" y2="1142" stroke="#D55E00" stroke-width="4" marker-end="url(#ar-orange)"></line><text x="750" y="1186" font-size="27" font-weight="400" fill="#D55E00" text-anchor="start">5. 等待运行结束</text><line x1="730" y1="1026" x2="730" y2="966" stroke="#D55E00" stroke-width="4" marker-end="url(#ar-orange)"></line><text x="764" y="1000" font-size="28" font-weight="400" fill="#D55E00" text-anchor="start">6. 标为完成</text></svg>
    </div>
    <div class="note"><strong>处理器只做轻校验并尽快回包，</strong>把提示注入等深检查留给运行阶段。工作进程被唤醒后先到表里取事件；它中途崩溃，接替者还能取到同一条，成功后事件才被标为完成。</div>
    <div class="rail" aria-label="五个组件进度"><span class="on">收件箱</span><span>定时器</span><span>记忆</span><span>权限</span><span>发件箱</span></div>
    <div class="foot"><span>William Hu · Anthropic《Building always-on agents》</span><span>事件收件箱</span></div>
  </div>
</article>
</div>
<script>
(function(){
  var card = document.getElementById('xhs-card');
  var W = 1080, H = 1440;
  function fit(){
    var vw = document.documentElement.clientWidth || window.innerWidth;
    var vh = document.documentElement.clientHeight || window.innerHeight;
    var scale = Math.min(vw / W, vh / H);
    card.style.transform = 'scale(' + scale + ')';
  }
  window.addEventListener('resize', fit);
  if (window.ResizeObserver) { new ResizeObserver(fit).observe(document.documentElement); }
  fit();
})();
</script>
</body>
</html>
