<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>两种搜索</title>

<style>
html,body{margin:0;padding:0;overflow:hidden;background:transparent}
#xhs-card{position:relative;width:1080px;height:1440px;overflow:hidden;transform-origin:top left}
</style>

<style>
body{margin:0;background:#FAF8F3;font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
.mono{font-family:ui-monospace,"SFMono-Regular",Menlo,monospace}
</style>

</head>
<body>
<div id="xhs-card">

<div style="width: 1080px; height: 1440px; box-sizing: border-box; padding: 96px 92px 72px; background: #FAF8F3; color: #16181D; display: flex; flex-direction: column; position: relative; overflow: hidden">

  <div style="position: absolute; right: 30px; top: 108px; writing-mode: vertical-rl; font-size: 18px; letter-spacing: 7px; color: #002FA7; opacity: 0.2; font-family: ui-monospace,Menlo,monospace">SOMEONE ONCE SAID</div>

  <div style="display: flex; align-items: center; justify-content: space-between">
    <div class="mono" style="font-size: 22px; letter-spacing: 0.16em; color: #5C6169">deepseek_web_search</div>
    <div class="mono" style="font-size: 22px; letter-spacing: 0.16em; color: #5C6169">04 / 08</div>
  </div>

  <div style="height: 1px; background: #DCD5C8; margin: 30px 0 56px"></div>

  <h2 style="margin: 0; font-size: 68px; line-height: 1.18; letter-spacing: -0.02em; font-weight: 700">同一个工具，<br>开不开思考是两件事</h2>

  <div style="margin-top: 50px; display: flex; flex-direction: column; gap: 0">

    <div style="padding: 30px 0; border-top: 1px solid #E6DFD2">
      <div class="mono" style="font-size: 21px; letter-spacing: 0.1em; color: #6B6F76">思考关闭</div>
      <div style="margin-top: 12px; font-size: 36px; font-weight: 600">联网搜索</div>
      <div style="margin-top: 12px; font-size: 27px; line-height: 1.6; color: #3A3F47">模型判断要不要搜，一次可带多个查询词，带引用作答。</div>
      <div class="mono" style="margin-top: 14px; font-size: 22px; color: #6B6F76">kind: search</div>
    </div>

    <div style="padding: 30px 0; border-top: 1px solid #E6DFD2">
      <div class="mono" style="font-size: 21px; letter-spacing: 0.1em; color: #6B6F76">思考开启</div>
      <div style="margin-top: 12px; font-size: 36px; font-weight: 600">深度思考搜索</div>
      <div style="margin-top: 12px; font-size: 27px; line-height: 1.6; color: #3A3F47">在多步推理中自己搜索、打开网页、页内查找，边推理边求证。</div>
      <div class="mono" style="margin-top: 14px; font-size: 22px; color: #6B6F76">kind: deep_search</div>
    </div>

  </div>

  <div style="margin-top: 44px; display: flex; gap: 14px; flex-wrap: wrap">
    <div class="mono" style="padding: 12px 18px; background: #F2EEE5; border-radius: 8px; font-size: 22px">search</div>
    <div class="mono" style="padding: 12px 18px; background: #F2EEE5; border-radius: 8px; font-size: 22px">open_page</div>
    <div class="mono" style="padding: 12px 18px; background: #F2EEE5; border-radius: 8px; font-size: 22px">find_in_page</div>
  </div>
  <div style="margin-top: 16px; font-size: 24px; line-height: 1.55; color: #6B6F76">前两个按次计费，页内查找不计费。</div>

  <div style="flex: 1"></div>

  <div style="border-top: 1px solid #DCD5C8; padding-top: 26px; display: flex; gap: 28px; align-items: baseline">
    <div class="mono" style="font-size: 56px; font-weight: 700; color: #002FA7; line-height: 1">20</div>
    <div style="font-size: 26px; line-height: 1.5; color: #3A3F47">官方文档：模型最多调用约 20 次工具后作答。这个上限决定单轮能查多深，也决定工具费的上限。</div>
  </div>
</div>
</div>
<script>
(function(){
  var card = document.getElementById('xhs-card');
  var W = 1080, H = 1440;
  function fit(){
    var vw = document.documentElement.clientWidth || window.innerWidth;
    var vh = document.documentElement.clientHeight || window.innerHeight;
    var scale = Math.min(vw / W, vh / H);
    card.style.transform = 'scale(' + scale + ')';
  }
  window.addEventListener('resize', fit);
  if (window.ResizeObserver) { new ResizeObserver(fit).observe(document.documentElement); }
  fit();
})();
</script>
</body>
</html>
