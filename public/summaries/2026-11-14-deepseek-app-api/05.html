<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>阅读链接</title>

<style>
html,body{margin:0;padding:0;overflow:hidden;background:transparent}
#xhs-card{position:relative;width:1080px;height:1440px;overflow:hidden;transform-origin:top left}
</style>

<style>
body{margin:0;background:#FAF8F3;font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
.mono{font-family:ui-monospace,"SFMono-Regular",Menlo,monospace}
</style>

</head>
<body>
<div id="xhs-card">

<div style="width: 1080px; height: 1440px; box-sizing: border-box; padding: 96px 92px 72px; background: #FAF8F3; color: #16181D; display: flex; flex-direction: column; position: relative; overflow: hidden">

  <div style="position: absolute; right: 30px; top: 108px; writing-mode: vertical-rl; font-size: 18px; letter-spacing: 7px; color: #002FA7; opacity: 0.2; font-family: ui-monospace,Menlo,monospace">SOMEONE ONCE SAID</div>

  <div style="display: flex; align-items: center; justify-content: space-between">
    <div class="mono" style="font-size: 22px; letter-spacing: 0.16em; color: #5C6169">deepseek_read_url</div>
    <div class="mono" style="font-size: 22px; letter-spacing: 0.16em; color: #5C6169">05 / 08</div>
  </div>

  <div style="height: 1px; background: #DCD5C8; margin: 30px 0 56px"></div>

  <h2 style="margin: 0; font-size: 68px; line-height: 1.18; letter-spacing: -0.02em; font-weight: 700">网页正文<br>不在响应里</h2>

  <p style="margin: 26px 0 0; font-size: 30px; line-height: 1.6; color: #3A3F47; max-width: 800px">读到的页面加密进 <span class="mono">signature</span>，下一轮靠它还原。所以历史必须原样回传。</p>

  <div style="margin-top: 48px; display: flex; flex-direction: column">

    <div style="display: flex; gap: 28px; padding: 24px 0; border-top: 1px solid #E6DFD2">
      <div class="mono" style="width: 44px; flex: none; font-size: 24px; color: #002FA7">1</div>
      <div style="font-size: 27px; line-height: 1.55">用户消息里有链接，模型决定读哪几个</div>
    </div>

    <div style="display: flex; gap: 28px; padding: 24px 0; border-top: 1px solid #E6DFD2">
      <div class="mono" style="width: 44px; flex: none; font-size: 24px; color: #002FA7">2</div>
      <div style="font-size: 27px; line-height: 1.55">结果块只给 URL、标题、时间；正文进 <span class="mono">signature</span></div>
    </div>

    <div style="display: flex; gap: 28px; padding: 24px 0; border-top: 1px solid #E6DFD2">
      <div class="mono" style="width: 44px; flex: none; font-size: 24px; color: #002FA7">3</div>
      <div style="font-size: 27px; line-height: 1.55">下一轮原样回传，服务端把这页拼回上下文</div>
    </div>

    <div style="display: flex; gap: 28px; padding: 24px 0; border-top: 1px solid #E6DFD2; border-bottom: 1px solid #E6DFD2">
      <div class="mono" style="width: 44px; flex: none; font-size: 24px; color: #002FA7">4</div>
      <div style="font-size: 27px; line-height: 1.55">签名失效不报错，网页内容静默丢失</div>
    </div>

  </div>

  <div style="flex: 1"></div>

  <div style="display: flex; gap: 18px; flex-wrap: wrap; margin-bottom: 26px">
    <div style="padding: 12px 20px; border: 1px solid #DCD5C8; border-radius: 999px; font-size: 23px; color: #3A3F47">只认最后一条用户消息</div>
    <div style="padding: 12px 20px; border: 1px solid #DCD5C8; border-radius: 999px; font-size: 23px; color: #3A3F47">最多前 10 个不同 URL</div>
    <div style="padding: 12px 20px; border: 1px solid #DCD5C8; border-radius: 999px; font-size: 23px; color: #3A3F47">多链接时单页会截断</div>
  </div>

  <div style="border-top: 1px solid #DCD5C8; padding-top: 26px; font-size: 26px; line-height: 1.5; color: #16181D">想自己清洗一遍历史再回传，网页内容就丢了。</div>
</div>
</div>
<script>
(function(){
  var card = document.getElementById('xhs-card');
  var W = 1080, H = 1440;
  function fit(){
    var vw = document.documentElement.clientWidth || window.innerWidth;
    var vh = document.documentElement.clientHeight || window.innerHeight;
    var scale = Math.min(vw / W, vh / H);
    card.style.transform = 'scale(' + scale + ')';
  }
  window.addEventListener('resize', fit);
  if (window.ResizeObserver) { new ResizeObserver(fit).observe(document.documentElement); }
  fit();
})();
</script>
</body>
</html>
