<div style="display:flex;align-items:center;justify-content:space-between;color:#6B6E68;font-size:28px;font-weight:650;letter-spacing:.05em"><span>OPEN AGENT RUNTIME</span><span style="color:#002FA7;font-weight:800">技术拆解 / 01</span></div>

<div style="margin-top:auto;display:flex;justify-content:space-between;align-items:center;color:#7b8088;font-size:28px"><span>OAR = Open Agent Runtime</span><span>向右滑，拆开看 →</span></div>
</div>
</div>
<script>
(function(){
  var card = document.getElementById('xhs-card');
  var W = 1080, H = 1440;
  function fit(){
    var vw = document.documentElement.clientWidth || window.innerWidth;
    var vh = document.documentElement.clientHeight || window.innerHeight;
    var scale = Math.min(vw / W, vh / H);
    card.style.transform = 'scale(' + scale + ')';
  }
  window.addEventListener('resize', fit);
  if (window.ResizeObserver) { new ResizeObserver(fit).observe(document.documentElement); }
  fit();
})();
</script>
</body>
