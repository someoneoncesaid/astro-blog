<h2 style="font-size:88px;line-height:1.05;letter-spacing:-.04em;margin:3% 0 2%;font-weight:850;color:#3B403B">任务怎么下去，<br><span style="color:#002FA7;text-decoration:underline;text-decoration-color:#C8D5F1;text-decoration-thickness:.08em;text-underline-offset:.12em">结果</span>怎么回来？</h2>
<p style="font-size:27px;line-height:1.4;color:#474c55;margin:0">统一接口向下调用原生 Agent；记录流向上提供事件与状态。</p>

</div>
<div style="margin-top:auto;display:flex;justify-content:space-between;align-items:center;color:#7b8088;font-size:28px"><span>任务下行 · 记录上行</span><span>05 / 07</span></div>
</div>
</div>
<script>
(function(){
  var card = document.getElementById('xhs-card');
  var W = 1080, H = 1440;
  function fit(){
    var vw = document.documentElement.clientWidth || window.innerWidth;
    var vh = document.documentElement.clientHeight || window.innerHeight;
    var scale = Math.min(vw / W, vh / H);
    card.style.transform = 'scale(' + scale + ')';
  }
  window.addEventListener('resize', fit);
  if (window.ResizeObserver) { new ResizeObserver(fit).observe(document.documentElement); }
  fit();
})();
</script>
