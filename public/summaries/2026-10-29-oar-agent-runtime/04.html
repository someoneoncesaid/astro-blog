<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>能力边界</title>

<style>
html,body{margin:0;padding:0;overflow:hidden;background:transparent}
#xhs-card{position:relative;width:1080px;height:1440px;overflow:hidden;transform-origin:top left}
</style>

<style>
body{margin:0}
a{color:#002FA7}a:hover{color:#002080}
</style>


</head>
<body>
<div id="xhs-card">

<div style="position:relative;width:1080px;height:1440px;box-sizing:border-box;padding:87px;background:#faf9f5;color:#3B403B;display:flex;flex-direction:column;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
<div style="position:absolute;right:15px;top:50%;transform:translateY(-50%);writing-mode:vertical-rl;letter-spacing:.18em;color:#002FA7;opacity:.2;font-weight:800;font-size:21px;line-height:1">SOMEONE ONCE SAID</div>
<div style="display:flex;align-items:center;justify-content:space-between;color:#6B6E68;font-size:28px;font-weight:650;letter-spacing:.05em"><span>03 / 能力边界</span><span style="color:#002FA7;font-weight:800">统一接口，不等于完全一致</span></div>
<h2 style="font-size:88px;line-height:1.05;letter-spacing:-.04em;margin:3.5% 0 2.5%;font-weight:850;color:#3B403B"><span style="color:#002FA7;text-decoration:underline;text-decoration-color:#C8D5F1;text-decoration-thickness:.08em;text-underline-offset:.12em">统一的是入口</span>，<br>差异还在底层</h2>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:17px">
<div style="padding:5%;background:#EEEDE6;border:2px solid #D8D6CD;border-radius:25px;display:flex;flex-direction:column"><div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;color:#002FA7"><svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M4 17h16"></path><circle cx="9" cy="7" r="2.5" fill="currentColor" stroke="none"></circle><circle cx="16" cy="17" r="2.5" fill="currentColor" stroke="none"></circle></svg><span style="padding:10px 18px;border-radius:99px;background:#E9EDF8;color:#002FA7;font-size:27px;font-weight:750">可统一</span></div><b style="display:block;font-size:32px;line-height:1.2;margin-bottom:6px">会话控制</b><p style="font-size:26px;line-height:1.35;color:#6B6E68;margin:0">发任务、收事件、取消会话；部分运行时支持恢复与排队。</p></div>
<div style="padding:5%;background:#EEEDE6;border:2px solid #D8D6CD;border-radius:25px;display:flex;flex-direction:column"><div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;color:#002FA7"><svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h8l4 4v14H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2ZM15 3v5h4M9 12h6M9 16h6"></path></svg><span style="padding:10px 18px;border-radius:99px;background:#E9EDF8;color:#002FA7;font-size:27px;font-weight:750">可统一</span></div><b style="display:block;font-size:32px;line-height:1.2;margin-bottom:6px">结果记录</b><p style="font-size:26px;line-height:1.35;color:#6B6E68;margin:0">把交互整理成事件或记录，方便上层处理与回放。</p></div>
<div style="padding:5%;background:#EEEDE6;border:2px solid #D8D6CD;border-radius:25px;display:flex;flex-direction:column"><div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;color:#002FA7"><svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7h13m0 0-3-3m3 3-3 3M19 17H6m0 0 3-3m-3 3 3 3"></path></svg><span style="padding:10px 18px;border-radius:99px;background:#E5E2D8;color:#3B403B;font-size:27px;font-weight:750">仍有差异</span></div><b style="display:block;font-size:32px;line-height:1.2;margin-bottom:6px">功能支持</b><p style="font-size:26px;line-height:1.35;color:#6B6E68;margin:0">模型与功能取决于具体 Agent 及其版本。</p></div>
<div style="padding:5%;background:#EEEDE6;border:2px solid #D8D6CD;border-radius:25px;display:flex;flex-direction:column"><div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;color:#002FA7"><svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2 4 6v6c0 5 3.5 8.5 8 10 4.5-1.5 8-5 8-10V6l-8-4Z"></path><path d="m9 12 2 2 4-4"></path></svg><span style="padding:10px 18px;border-radius:99px;background:#E5E2D8;color:#3B403B;font-size:27px;font-weight:750">仍有差异</span></div><b style="display:block;font-size:32px;line-height:1.2;margin-bottom:6px">权限与沙箱</b><p style="font-size:26px;line-height:1.35;color:#6B6E68;margin:0">权限与沙箱仍按各 Agent 的设置生效。</p></div>
</div>
<div style="margin:4% 0 1%;padding:4%;border-radius:29px;background:#E9EDF8"><div style="font-size:28px;font-weight:800;color:#002FA7;letter-spacing:.08em">OAR 的处理原则</div><p style="font-size:34px;line-height:1.3;margin:10px 0 0;font-weight:750">不支持的选项会在启动前报错。</p></div>
<p style="font-size:22px;line-height:1.45;color:#777d84;margin:2% 0 0">接入前先核对：运行时版本、支持选项、权限模式、沙箱设置。</p>
<div style="margin-top:auto;display:flex;justify-content:space-between;align-items:center;color:#7b8088;font-size:28px"><span>调用方式可以统一，能力需要逐个确认</span><span>04 / 07</span></div>
</div>
</div>
<script>
(function(){
  var card = document.getElementById('xhs-card');
  var W = 1080, H = 1440;
  function fit(){
    var vw = document.documentElement.clientWidth || window.innerWidth;
    var vh = document.documentElement.clientHeight || window.innerHeight;
    var scale = Math.min(vw / W, vh / H);
    card.style.transform = 'scale(' + scale + ')';
  }
  window.addEventListener('resize', fit);
  if (window.ResizeObserver) { new ResizeObserver(fit).observe(document.documentElement); }
  fit();
})();
</script>
</body>
</html>
