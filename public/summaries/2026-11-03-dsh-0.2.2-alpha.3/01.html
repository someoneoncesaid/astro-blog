<body>

  <div aria-hidden="true" style="position:absolute;right:-56px;top:66px;font-family:'Songti SC','STSong','Noto Serif CJK SC',serif;font-size:560px;line-height:1;color:#002FA7;opacity:0.055;pointer-events:none">α</div>

    <div style="padding:26px 0 24px;border-right:1px solid #D7CEBB">
      <div style="font-family:'Songti SC','STSong',serif;font-size:62px;line-height:1;color:#002FA7">3</div>
      <div style="margin-top:10px;font-size:20px;letter-spacing:1px;color:#6B665A">条主线</div>
    </div>

      <div style="font-family:'Songti SC','STSong',serif;font-size:62px;line-height:1;color:#211F1A">6</div>

    </div>
    <div style="padding:26px 0 24px 30px;border-right:1px solid #D7CEBB">
      <div style="font-family:'Songti SC','STSong',serif;font-size:62px;line-height:1;color:#211F1A">10</div>

    <span style="font-family:'SF Mono','Menlo',monospace;letter-spacing:1px">01 / 08</span>
  </div>
</div>
</div>
<script>
(function(){
  var card = document.getElementById('xhs-card');
  var W = 1080, H = 1440;
  function fit(){
    var vw = document.documentElement.clientWidth || window.innerWidth;
    var vh = document.documentElement.clientHeight || window.innerHeight;
    var scale = Math.min(vw / W, vh / H);
    card.style.transform = 'scale(' + scale + ')';
  }
  window.addEventListener('resize', fit);
  if (window.ResizeObserver) { new ResizeObserver(fit).observe(document.documentElement); }
  fit();
})();
</script>
</body>
</html>
