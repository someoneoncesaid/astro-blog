<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>右键菜单</title>

<style>
html,body{margin:0;padding:0;overflow:hidden;background:transparent}
#xhs-card{position:relative;width:1080px;height:1440px;overflow:hidden;transform-origin:top left}
</style>

<style>
body{margin:0}
a{color:#002FA7}a:hover{color:#001E6B}
</style>

</head>
<body>
<div id="xhs-card">

<div style="width:1080px;height:1440px;box-sizing:border-box;padding:76px 84px 60px;background:#F6F2E7;color:#211F1A;font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC',sans-serif;display:flex;flex-direction:column">
  <div style="display:flex;justify-content:space-between;align-items:flex-start;font-family:'SF Mono','Menlo',monospace;font-size:19px;letter-spacing:2.4px;color:#6B665A">
    <span>DEEPSEEK HARNESS</span>
    <span>0.2.2-alpha.3 / 2026-11-03</span>
  </div>
  <div style="height:1px;background:#211F1A;margin-top:18px"></div>

  <div style="margin-top:58px;font-family:'SF Mono','Menlo',monospace;font-size:22px;letter-spacing:1.6px;color:#002FA7">01 / CONTEXT MENU</div>
  <div style="margin-top:14px;font-size:24px;letter-spacing:2px;color:#6B665A">会话 / 工作区 / 侧边栏</div>
  <h1 style="margin:24px 0 0;font-family:'Songti SC','STSong','Noto Serif CJK SC',serif;font-size:96px;line-height:1.18;font-weight:600;letter-spacing:-2px">一套右键<br>走到哪都一样</h1>
  <p style="margin:28px 0 0;font-size:28px;line-height:1.7;color:#4A463C;max-width:820px">以前右键能做什么，取决于那块界面自己实现了什么。这一版收成一套。</p>

  <div style="margin-top:52px;border-top:1px solid #211F1A">
    <div style="display:flex;gap:30px;border-bottom:1px solid #CFC6B2;padding:28px 0">
      <span style="font-family:'SF Mono','Menlo',monospace;font-size:19px;letter-spacing:1px;color:#002FA7;padding-top:7px">01</span>
      <div style="font-size:30px;line-height:1.6">会话、工作区、侧边栏，共用同一套菜单模型。</div>
    </div>
    <div style="display:flex;gap:30px;border-bottom:1px solid #CFC6B2;padding:28px 0">
      <span style="font-family:'SF Mono','Menlo',monospace;font-size:19px;letter-spacing:1px;color:#002FA7;padding-top:7px">02</span>
      <div style="font-size:30px;line-height:1.6">键盘也能呼出同一套菜单，不用记两套操作。</div>
    </div>
    <div style="display:flex;gap:30px;border-bottom:1px solid #CFC6B2;padding:28px 0">
      <span style="font-family:'SF Mono','Menlo',monospace;font-size:19px;letter-spacing:1px;color:#002FA7;padding-top:7px">03</span>
      <div style="font-size:30px;line-height:1.6">开发者可以往菜单里加自己的条目，不必另造浮层。</div>
    </div>
  </div>

  <div style="margin-top:36px;padding-top:22px;border-top:2px solid #002FA7">
    <div style="font-family:'SF Mono','Menlo',monospace;font-size:17px;letter-spacing:2px;color:#002FA7">原文边界</div>
    <p style="margin:10px 0 0;font-size:22px;line-height:1.7;color:#5F5A4E;max-width:860px">发布说明只说「覆盖」与「可扩展」，没有承诺所有内置操作都进了菜单。找不到某个操作，不必当成回归。</p>
  </div>

  <div style="margin-top:auto;display:flex;justify-content:space-between;align-items:baseline;font-size:18px;color:#6B665A">
    <span>事实来源：dsh-v0.2.2-alpha.3 发布说明</span>
    <span style="font-family:'SF Mono','Menlo',monospace;letter-spacing:1px">03 / 08</span>
  </div>
</div>
</div>
<script>
(function(){
  var card = document.getElementById('xhs-card');
  var W = 1080, H = 1440;
  function fit(){
    var vw = document.documentElement.clientWidth || window.innerWidth;
    var vh = document.documentElement.clientHeight || window.innerHeight;
    var scale = Math.min(vw / W, vh / H);
    card.style.transform = 'scale(' + scale + ')';
  }
  window.addEventListener('resize', fit);
  if (window.ResizeObserver) { new ResizeObserver(fit).observe(document.documentElement); }
  fit();
})();
</script>
</body>
</html>
