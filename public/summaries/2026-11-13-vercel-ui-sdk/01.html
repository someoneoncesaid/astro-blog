<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>封面</title>

<style>
html,body{margin:0;padding:0;overflow:hidden;background:transparent}
#xhs-card{position:relative;width:1080px;height:1440px;overflow:hidden;transform-origin:top left}
</style>

<style>
body{margin:0}
.ui-card{font-family:-apple-system,'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:#FBFAF6;color:#17171A;position:relative;width:1080px;height:1440px;box-sizing:border-box;display:flex;flex-direction:column;padding:80px 118px 64px 88px}
.ui-mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace}
</style>

</head>
<body>
<div id="xhs-card">

<div class="ui-card">
  <div style="display:flex;align-items:center;justify-content:space-between">
    <div style="font-size:26px;font-weight:700;letter-spacing:6px;color:#002FA7">开源仓库精读</div>
    <div style="font-size:24px;color:#8A8A90" class="ui-mono">01 / 08</div>
  </div>
  <div style="height:1px;background:#E7E4DC;margin:32px 0 48px"></div>
  <h1 style="margin:0;font-size:88px;line-height:1.16;font-weight:800;letter-spacing:1px">AI 会写界面，<br>却总写错<br>键盘导航</h1>
  <div style="width:88px;height:8px;background:#002FA7;border-radius:4px;margin:36px 0"></div>
  <p style="margin:0;font-size:31px;line-height:1.55;color:#54545A">Vercel 开源 <span class="ui-mono" style="font-size:28px">UI SDK</span>：不是又一个组件库，而是组件库底下那一层——可复用、可测试的「行为」。</p>
  <div style="flex:1"></div>
  <div style="border:1px solid #E7E4DC;border-radius:18px;background:#FFFFFF;padding:14px;box-shadow:0 2px 6px rgba(23,23,26,.06)">
    <img src="assets/rel-57e9b75d.jpg" alt="ui-sdk.dev 官网首页截图，标语为 A library of behaviors for agents to build the next generation of user interfaces" style="width:100%;height:auto;border-radius:10px;display:block">
  </div>
  <div style="font-size:20px;color:#8A8A90;margin-top:14px">官网首页原话：A library of behaviors for agents to build the next generation of user interfaces.</div>
  <div style="display:flex;align-items:center;justify-content:space-between;margin-top:32px;padding-top:24px;border-top:1px solid #E7E4DC">
    <span class="ui-mono" style="font-size:22px;color:#8A8A90">github.com/vercel-labs/ui</span>
    <span style="font-size:22px;color:#8A8A90">ui-sdk.dev · beta</span>
  </div>
  <div aria-hidden="true" style="position:absolute;right:30px;top:50%;transform:translateY(-50%);writing-mode:vertical-rl;font-size:17px;letter-spacing:7px;color:#002FA7;opacity:.2;font-weight:700">SOMEONE ONCE SAID</div>
</div>
</div>
<script>
(function(){
  var card = document.getElementById('xhs-card');
  var W = 1080, H = 1440;
  function fit(){
    var vw = document.documentElement.clientWidth || window.innerWidth;
    var vh = document.documentElement.clientHeight || window.innerHeight;
    var scale = Math.min(vw / W, vh / H);
    card.style.transform = 'scale(' + scale + ')';
  }
  window.addEventListener('resize', fit);
  if (window.ResizeObserver) { new ResizeObserver(fit).observe(document.documentElement); }
  fit();
})();
</script>
</body>
</html>
