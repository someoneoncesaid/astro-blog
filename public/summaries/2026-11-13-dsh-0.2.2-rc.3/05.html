<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>导入进度</title>

<style>
html,body{margin:0;padding:0;overflow:hidden;background:transparent}
#xhs-card{position:relative;width:1080px;height:1440px;overflow:hidden;transform-origin:top left}
</style>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Serif+SC:wght@700;900&display=swap">
<style>body{margin:0}</style>

</head>
<body>
<div id="xhs-card">

<div style="width: 1080px; height: 1440px; box-sizing: border-box; position: relative; overflow: hidden; background: #FAF9F6; color: #1C1B17; font-family: 'Noto Sans SC', 'PingFang SC', sans-serif">

  <div style="padding: 64px 132px 0 76px">
    <div style="display: flex; align-items: center; gap: 16px">
      <span style="font-family: 'JetBrains Mono', monospace; font-weight: 500; font-size: 23px; line-height: 1; letter-spacing: .2em; color: #6D6A62">STEP 04 · IMPORT</span>
      <span style="margin-left: auto; font-family: 'JetBrains Mono', monospace; font-weight: 500; font-size: 21px; line-height: 1; color: #002FA7; border: 1.5px solid rgba(0,47,167,.35); border-radius: 999px; padding: 9px 20px; white-space: nowrap">逐段处理</span>
    </div>
    <h2 style="margin: 20px 0 0; font-family: 'Noto Serif SC', 'Songti SC', serif; font-weight: 900; font-size: 68px; line-height: 1.3; letter-spacing: .01em">等进度走完</h2>
    <div style="height: 1.5px; background: #E5E2D9; margin-top: 28px"></div>
  </div>

  <div style="padding: 44px 132px 0 76px">
    <figure style="margin: 0">
      <img src="assets/rel-3aa17a47.png" alt="导入进行中的进度提示，显示正在导入第 7 段、共 28 段" style="display: block; width: 100%; height: auto; border: 1.5px solid #E5E2D9; border-radius: 16px">
    </figure>
    <div style="display: flex; gap: 18px; align-items: flex-start; margin-top: 24px">
      <span style="flex: none; height: 42px; padding: 0 18px; border-radius: 999px; background: #002FA7; color: #FFFFFF; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 22px; line-height: 42px">7/28</span>
      <p style="margin: 2px 0 0; font-size: 32px; line-height: 1.6; color: #6D6A62">示例实拍：当时正在导入第 7 段，共 28 段。</p>
    </div>
    <p style="margin: 34px 0 0; font-size: 34px; line-height: 1.65; color: #6D6A62">结束后会汇总每段是导入、跳过还是失败。<br>这张图只展示进行中的进度。</p>
  </div>

  <div style="position: absolute; left: 76px; right: 132px; bottom: 48px; display: flex; justify-content: space-between; align-items: baseline; border-top: 1.5px solid #E5E2D9; padding-top: 20px; font-family: 'JetBrains Mono', monospace; font-weight: 500; font-size: 20px; letter-spacing: .12em; color: #6F6B61">
    <span>DSH · 0.2.2-rc.3</span>
    <span>05 / 06</span>
  </div>

  <div aria-hidden="true" style="position: absolute; right: 28px; top: 50%; transform: translateY(-50%); writing-mode: vertical-rl; font-family: 'JetBrains Mono', monospace; font-weight: 500; font-size: 23px; letter-spacing: .58em; color: rgba(0,47,167,.2); user-select: none; pointer-events: none">SOMEONE ONCE SAID</div>
</div>
</div>
<script>
(function(){
  var card = document.getElementById('xhs-card');
  var W = 1080, H = 1440;
  function fit(){
    var vw = document.documentElement.clientWidth || window.innerWidth;
    var vh = document.documentElement.clientHeight || window.innerHeight;
    var scale = Math.min(vw / W, vh / H);
    card.style.transform = 'scale(' + scale + ')';
  }
  window.addEventListener('resize', fit);
  if (window.ResizeObserver) { new ResizeObserver(fit).observe(document.documentElement); }
  fit();
})();
</script>
</body>
</html>
