<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>拒答的完整路径</title>

<style>
html,body{margin:0;padding:0;overflow:hidden;background:transparent}
#xhs-card{position:relative;width:1080px;height:1440px;overflow:hidden;transform-origin:top left}
</style>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Serif+SC:wght@700;900&display=swap">
<style>body{margin:0}</style>

</head>
<body>
<div id="xhs-card">

<div style="width: 1080px; height: 1440px; box-sizing: border-box; position: relative; overflow: hidden; background: #FAF9F4; color: #1C1B17; font-family: 'Noto Sans SC', 'PingFang SC', sans-serif">

  <div style="padding: 64px 132px 0 76px">
    <div style="display: flex; align-items: center; gap: 16px">
      <span style="font-family: 'JetBrains Mono', monospace; font-weight: 500; font-size: 23px; line-height: 1; letter-spacing: .2em; color: #6D6A62">BEHAVIOR · RC.4</span>
      <span style="margin-left: auto; font-family: 'JetBrains Mono', monospace; font-weight: 500; font-size: 21px; line-height: 1; color: #002FA7; border: 1.5px solid rgba(0,47,167,.35); border-radius: 999px; padding: 9px 20px; white-space: nowrap">从判定到失败</span>
    </div>
    <h2 style="margin: 20px 0 0; font-family: 'Noto Serif SC', 'Songti SC', serif; font-weight: 900; font-size: 68px; line-height: 1.3; letter-spacing: .01em">拒答的完整路径</h2>
    <div style="height: 1.5px; background: #E5E2D9; margin-top: 28px"></div>
  </div>

  <svg aria-hidden="true" viewBox="0 0 1080 1440" width="1080" height="1440" style="position: absolute; left: 0; top: 0; pointer-events: none">
    <defs>
      <marker id="rf-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6D6A62"/></marker>
      <marker id="rf-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#002FA7"/></marker>
    </defs>

    <!-- Arrows -->
    <line x1="320" y1="360" x2="320" y2="404" stroke="#6D6A62" stroke-width="2.4" marker-end="url(#rf-arrow)"/>
    <line x1="560" y1="524" x2="672" y2="524" stroke="#6D6A62" stroke-width="2.4" marker-end="url(#rf-arrow)"/>
    <line x1="320" y1="644" x2="320" y2="688" stroke="#002FA7" stroke-width="2.8" marker-end="url(#rf-arrow-accent)"/>
    <line x1="320" y1="802" x2="320" y2="846" stroke="#6D6A62" stroke-width="2.4" marker-end="url(#rf-arrow)"/>
    <line x1="320" y1="960" x2="320" y2="1004" stroke="#6D6A62" stroke-width="2.4" marker-end="url(#rf-arrow)"/>

    <!-- Arrow labels -->
    <rect x="592" y="486" width="56" height="28" rx="3" fill="#FAF9F4"/>
    <text x="620" y="507" fill="#6D6A62" font-size="20" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>
    <rect x="336" y="650" width="56" height="28" rx="3" fill="#FAF9F4"/>
    <text x="364" y="671" fill="#002FA7" font-size="20" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>
    <rect x="336" y="810" width="156" height="28" rx="3" fill="#FAF9F4"/>
    <text x="414" y="831" fill="#6D6A62" font-size="18" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.06em">MESSAGE_STOP</text>

    <!-- Start oval -->
    <rect x="130" y="264" width="380" height="96" rx="24" fill="rgba(28,27,23,0.03)" stroke="rgba(28,27,23,0.30)" stroke-width="1.5"/>
    <text x="320" y="306" fill="#1C1B17" font-size="30" font-weight="700" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="middle">官方 Messages 流</text>
    <text x="320" y="340" fill="#6D6A62" font-size="22" font-family="'JetBrains Mono', monospace" text-anchor="middle">SSE · deepseek-official</text>

    <!-- Decision diamond -->
    <polygon points="320,404 560,524 320,644 80,524" fill="#FFFFFF" stroke="#1C1B17" stroke-width="1.5"/>
    <text x="320" y="494" fill="#6D6A62" font-size="22" font-family="'JetBrains Mono', monospace" text-anchor="middle">message_delta.stop_reason</text>
    <text x="320" y="548" fill="#1C1B17" font-size="30" font-weight="700" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="middle">= refusal ?</text>

    <!-- NO branch oval -->
    <rect x="672" y="476" width="276" height="96" rx="24" fill="rgba(28,27,23,0.03)" stroke="rgba(28,27,23,0.30)" stroke-width="1.5"/>
    <text x="810" y="516" fill="#1C1B17" font-size="30" font-weight="700" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="middle">正常结束处理</text>
    <text x="810" y="550" fill="#6D6A62" font-size="20" font-family="'JetBrains Mono', monospace" text-anchor="middle">end_turn · tool_use</text>

    <!-- YES: construct the refusal error -->
    <rect x="110" y="688" width="420" height="114" rx="10" fill="#FFFFFF" stroke="#1C1B17" stroke-width="1.5"/>
    <text x="320" y="734" fill="#1C1B17" font-size="30" font-weight="700" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="middle">构造拒答错误</text>
    <text x="320" y="776" fill="#6D6A62" font-size="22" font-family="'JetBrains Mono', monospace" text-anchor="middle">LlmError · CONTENT_REFUSED</text>

    <!-- Report billed usage first -->
    <rect x="110" y="846" width="420" height="114" rx="10" fill="#FFFFFF" stroke="#1C1B17" stroke-width="1.5"/>
    <text x="320" y="892" fill="#1C1B17" font-size="30" font-weight="700" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="middle">先报已计费用量</text>
    <text x="320" y="934" fill="#6D6A62" font-size="22" font-family="'JetBrains Mono', monospace" text-anchor="middle">yield usage · billed tokens</text>

    <!-- Focal: throw CONTENT_REFUSED -->
    <rect x="100" y="1004" width="440" height="128" rx="28" fill="rgba(0,47,167,0.08)" stroke="#002FA7" stroke-width="2"/>
    <text x="320" y="1054" fill="#1C1B17" font-size="30" font-weight="700" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="middle">抛出 CONTENT_REFUSED</text>
    <text x="320" y="1096" fill="#6D6A62" font-size="22" font-family="'JetBrains Mono', monospace" text-anchor="middle">no retryChoice</text>

    <!-- Side notes: downstream -->
    <text x="560" y="672" fill="#002FA7" font-size="21" font-weight="700" font-family="'JetBrains Mono', monospace" letter-spacing="0.2em">下游一致</text>
    <text x="560" y="708" fill="#002FA7" font-size="28" font-family="'Noto Sans SC', 'PingFang SC', sans-serif">—</text>
    <text x="594" y="708" fill="#1C1B17" font-size="28" font-family="'Noto Sans SC', 'PingFang SC', sans-serif">Web 撤回已流式显示的回复</text>
    <text x="560" y="762" fill="#002FA7" font-size="28" font-family="'Noto Sans SC', 'PingFang SC', sans-serif">—</text>
    <text x="594" y="762" fill="#1C1B17" font-size="28" font-family="'Noto Sans SC', 'PingFang SC', sans-serif">Session 存 <tspan font-family="'JetBrains Mono', monospace" font-size="18">assistant/attempt</tspan></text>
    <text x="560" y="816" fill="#002FA7" font-size="28" font-family="'Noto Sans SC', 'PingFang SC', sans-serif">—</text>
    <text x="594" y="816" fill="#1C1B17" font-size="28" font-family="'Noto Sans SC', 'PingFang SC', sans-serif">模型历史不含这段回复</text>
    <text x="560" y="870" fill="#002FA7" font-size="28" font-family="'Noto Sans SC', 'PingFang SC', sans-serif">—</text>
    <text x="594" y="870" fill="#1C1B17" font-size="28" font-family="'Noto Sans SC', 'PingFang SC', sans-serif">默认重试结束本次尝试</text>

    <!-- Closing reference -->
    <text x="76" y="1196" fill="#6D6A62" font-size="30" font-family="'Noto Sans SC', 'PingFang SC', sans-serif">配套一条升级指南与 authored 回放快照</text>
    <text x="76" y="1246" fill="#1C1B17" font-size="22" font-family="'JetBrains Mono', monospace">upgrade-guide/v0.2.2-rc.3/deepseek-refusal-code</text>
  </svg>

  <div style="position: absolute; left: 76px; right: 132px; bottom: 48px; display: flex; justify-content: space-between; align-items: baseline; border-top: 1.5px solid #E5E2D9; padding-top: 20px; font-family: 'JetBrains Mono', monospace; font-weight: 500; font-size: 20px; letter-spacing: .12em; color: #6F6B61">
    <span>DEEPSEEK HARNESS · 0.2.2-rc.4</span>
    <span>03 / 09</span>
  </div>

  <div aria-hidden="true" style="position: absolute; right: 28px; top: 50%; transform: translateY(-50%); writing-mode: vertical-rl; font-family: 'JetBrains Mono', monospace; font-weight: 500; font-size: 23px; letter-spacing: .58em; color: rgba(0,47,167,.2); user-select: none; pointer-events: none">SOMEONE ONCE SAID</div>
</div>
</div>
<script>
(function(){
  var card = document.getElementById('xhs-card');
  var W = 1080, H = 1440;
  function fit(){
    var vw = document.documentElement.clientWidth || window.innerWidth;
    var vh = document.documentElement.clientHeight || window.innerHeight;
    var scale = Math.min(vw / W, vh / H);
    card.style.transform = 'scale(' + scale + ')';
  }
  window.addEventListener('resize', fit);
  if (window.ResizeObserver) { new ResizeObserver(fit).observe(document.documentElement); }
  fit();
})();
</script>
</body>
</html>
