<div style="display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid #111110;padding-bottom:19px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:18px;letter-spacing:0.12em">

</div>

<span style="font-family:ui-monospace,Menlo,monospace;font-size:18px">向右滑 →</span>
</div>
</div>
</div>
</div>
<script>
(function(){
  var card = document.getElementById('xhs-card');
  var W = 1080, H = 1440;
  function fit(){
    var vw = document.documentElement.clientWidth || window.innerWidth;
    var vh = document.documentElement.clientHeight || window.innerHeight;
    var scale = Math.min(vw / W, vh / H);
    card.style.transform = 'scale(' + scale + ')';
  }
  window.addEventListener('resize', fit);
  if (window.ResizeObserver) { new ResizeObserver(fit).observe(document.documentElement); }
  fit();
})();
</script>
</body>
</html>
