<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>攻击链</title>

<style>
html,body{margin:0;padding:0;overflow:hidden;background:transparent}
#xhs-card{position:relative;width:1080px;height:1440px;overflow:hidden;transform-origin:top left}
</style>
<style>body{margin:0;background:#FBFAF6;font-family:"PingFang SC","Noto Sans CJK SC","Hiragino Sans GB",sans-serif}a{color:#002FA7}a:hover{color:#00205F}</style>
</head>
<body>
<div id="xhs-card">

<div style="width:1080px;height:1440px;box-sizing:border-box;position:relative;padding:77px;background:#FBFAF6;color:#111110;display:flex;flex-direction:column;gap:41px">
<div style="position:absolute;right:26px;top:150px;writing-mode:vertical-rl;font-family:ui-monospace,Menlo,monospace;font-size:14px;letter-spacing:0.34em;color:rgba(0,47,167,0.2)">SOMEONE ONCE SAID</div>
<div style="display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid #111110;padding-bottom:17px;font-family:ui-monospace,Menlo,monospace;font-size:18px;letter-spacing:0.12em">
<span>01 · 先看清攻击面</span>
<span>02 / 07</span>
</div>
<div style="display:flex;flex-direction:column;gap:17px">
<div style="font-size:74px;line-height:1.12;font-weight:800;letter-spacing:-0.035em">注入是四步，<br>它只守后三步</div>
<div style="font-size:24px;line-height:1.7;color:#6E6E68;max-width:864px">完整链条是这样的。防守位置选在哪一步，决定了整套设计长什么样。</div>
</div>
<div style="display:flex;flex-direction:column;gap:17px">
<div style="display:flex;gap:24px;align-items:baseline;border-top:1px solid #DEDCD2;padding-top:19px"><div style="font-family:ui-monospace,Menlo,monospace;font-size:31px;color:#002FA7;width:53px">01</div><div><div style="font-size:30px;font-weight:700">不可信内容进入上下文</div><div style="font-size:22px;line-height:1.6;color:#6E6E68;margin-top:5px">网页、文件、命令输出、其他会话、子 agent 消息</div></div></div>
<div style="display:flex;gap:24px;align-items:baseline;border-top:1px solid #DEDCD2;padding-top:19px"><div style="font-family:ui-monospace,Menlo,monospace;font-size:31px;color:#002FA7;width:53px">02</div><div><div style="font-size:30px;font-weight:700">模型把这段内容当成指令</div><div style="font-size:22px;line-height:1.6;color:#6E6E68;margin-top:5px">内容越像任务，越容易被当成命令</div></div></div>
<div style="display:flex;gap:24px;align-items:baseline;border-top:1px solid #DEDCD2;padding-top:19px"><div style="font-family:ui-monospace,Menlo,monospace;font-size:31px;color:#002FA7;width:53px">03</div><div><div style="font-size:30px;font-weight:700">模型发起工具调用</div><div style="font-size:22px;line-height:1.6;color:#6E6E68;margin-top:5px">读文件、跑命令、发请求</div></div></div>
<div style="display:flex;gap:24px;align-items:baseline;border-top:1px solid #DEDCD2;padding-top:19px"><div style="font-family:ui-monospace,Menlo,monospace;font-size:31px;color:#002FA7;width:53px">04</div><div><div style="font-size:30px;font-weight:700">工具在宿主机产生真实效果</div><div style="font-size:22px;line-height:1.6;color:#6E6E68;margin-top:5px">删了、传了、部署了，才叫损失</div></div></div>
</div>
<div style="display:flex;gap:14px;margin-top:2px">
<div style="flex:1;background:#F1F0E9;padding:19px 22px"><div style="font-family:ui-monospace,Menlo,monospace;font-size:17px;color:#002FA7">第二步之前</div><div style="font-size:24px;font-weight:700;margin-top:7px">来源标注</div></div>
<div style="flex:1;background:#F1F0E9;padding:19px 22px"><div style="font-family:ui-monospace,Menlo,monospace;font-size:17px;color:#002FA7">第三步</div><div style="font-size:24px;font-weight:700;margin-top:7px">效果审查</div></div>
<div style="flex:1;background:#F1F0E9;padding:19px 22px"><div style="font-family:ui-monospace,Menlo,monospace;font-size:17px;color:#002FA7">第四步</div><div style="font-size:24px;font-weight:700;margin-top:7px">沙箱与审批</div></div>
</div>
<div style="margin-top:auto;border-top:2px solid #111110;padding-top:22px;font-size:28px;line-height:1.6">所以「它用什么正则拦注入」是个问错的问题——<span style="color:#002FA7">它根本没打算在那一步赢。</span></div>
</div>
</div>
<script>
(function(){
  var card = document.getElementById('xhs-card');
  var W = 1080, H = 1440;
  function fit(){
    var vw = document.documentElement.clientWidth || window.innerWidth;
    var vh = document.documentElement.clientHeight || window.innerHeight;
    var scale = Math.min(vw / W, vh / H);
    card.style.transform = 'scale(' + scale + ')';
  }
  window.addEventListener('resize', fit);
  if (window.ResizeObserver) { new ResizeObserver(fit).observe(document.documentElement); }
  fit();
})();
</script>
</body>
</html>
