<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>发件箱</title>

<style>
html,body{margin:0;padding:0;overflow:hidden;background:transparent}
#xhs-card{position:relative;width:1080px;height:1440px;overflow:hidden;transform-origin:top left}
</style>

<style>
body{margin:0;background:#F7F4EE}
.card{position:relative;width:1080px;height:1440px;background:#F7F4EE;color:#17171A;overflow:hidden;font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.card .pad{position:absolute;inset:0;padding:76px 96px 60px 80px;display:flex;flex-direction:column;box-sizing:border-box}
.kick{display:flex;justify-content:space-between;align-items:baseline;font-size:21px;letter-spacing:.16em;color:#6E6A5E}
.kick .b{font-weight:600;color:#17171A;letter-spacing:.10em}
.rule{height:1px;background:#DCD5C6;margin-top:18px;flex:none}
.eyebrow{margin-top:44px;font-size:22px;letter-spacing:.22em;color:#002FA7;font-weight:600}
.h1{margin:18px 0 0;font-family:"Songti SC","STSong","Source Han Serif SC","Noto Serif CJK SC",serif;font-weight:600;font-size:64px;line-height:1.30;letter-spacing:.01em}
.deck{margin:26px 0 0;font-size:30px;line-height:1.76;color:#4E4B45;max-width:850px}
.panel{margin-top:38px;background:#FFFDF8;border:1px solid #DCD5C6;border-radius:3px}
.panel svg{display:block;width:100%;height:auto}
.panel text{font-family:"PingFang SC","Hiragino Sans GB",system-ui,sans-serif}
.note{margin-top:auto;padding-top:30px;font-size:24px;line-height:1.7;color:#6E6A5E}
.note strong{color:#17171A;font-weight:600}
.rail{display:flex;align-items:center;margin-top:18px}
.rail span{flex:1;position:relative;padding-left:16px;font-size:18px;letter-spacing:.06em;color:#B5AE9E}
.rail span::before{content:"";position:absolute;left:0;top:50%;width:5px;height:5px;border-radius:50%;background:#CFC7B6;transform:translateY(-50%)}
.rail span.on{color:#002FA7;font-weight:600}
.rail span.on::before{background:#002FA7;width:7px;height:7px}
.foot{margin-top:22px;padding-top:20px;border-top:1px solid #DCD5C6;display:flex;justify-content:space-between;gap:24px;font-size:19px;color:#8A8578;letter-spacing:.03em}
.mark{position:absolute;top:104px;right:26px;writing-mode:vertical-rl;font-size:13px;letter-spacing:.34em;color:rgba(0,47,167,.20);font-family:"Helvetica Neue",Arial,sans-serif}
</style>

</head>
<body>
<div id="xhs-card">

<article class="card">
  <span class="mark">SOMEONE ONCE SAID</span>
  <div class="pad">
    <div class="kick"><span><span class="b">常驻 AGENT</span> · 架构拆解</span><span>07 / 08</span></div>
    <div class="rule"></div>
    <div class="eyebrow">组件 05 · 发件箱</div>
    <h1 class="h1">该出声，还是该安静？</h1>
    <p class="deck">后台任务可能汇报结果、请求输入，也可能安静结束。要控制通知节奏或在投递失败后恢复，就把待发消息写入发件箱，由独立的 dispatcher 投递。</p>
    <div class="panel">
      <svg viewBox="0 0 904 560" role="img" aria-label="run 结束后的三种出口：直接发送、写入发件箱、安静结束">
        <defs><marker id="a7" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#A9A293"/></marker></defs>
        <text x="24" y="48" font-size="20" fill="#002FA7">通知的多与少，是要单独调的一个旋钮。</text>
        <rect x="24" y="242" width="160" height="96" rx="3" fill="#FFFDF8" stroke="#C9C2B1" stroke-width="1.2"/>
        <text x="48" y="298" font-size="23" fill="#17171A">run 结束</text>
        <path d="M184,290 L232,290 L232,144 L242,144" fill="none" stroke="#A9A293" stroke-width="1.5" marker-end="url(#a7)"/>
        <path d="M184,290 L242,290" fill="none" stroke="#A9A293" stroke-width="1.5" marker-end="url(#a7)"/>
        <path d="M184,290 L232,290 L232,436 L242,436" fill="none" stroke="#A9A293" stroke-width="1.5" marker-end="url(#a7)"/>
        <rect x="248" y="96" width="262" height="96" rx="3" fill="#FFFDF8" stroke="#C9C2B1" stroke-width="1.2"/>
        <text x="268" y="140" font-size="22" fill="#17171A">直接发送</text>
        <text x="268" y="172" font-size="19" fill="#6E6A5E">简单场景：发送工具通知</text>
        <rect x="248" y="242" width="262" height="96" rx="3" fill="#E9EDF9" stroke="#002FA7" stroke-width="1.5"/>
        <text x="268" y="286" font-size="22" fill="#1E2B54">写入发件箱</text>
        <text x="268" y="318" font-size="19" fill="#3A3C4A">待发消息先落盘</text>
        <rect x="248" y="388" width="262" height="96" rx="3" fill="#FFFDF8" stroke="#C9C2B1" stroke-width="1.2"/>
        <text x="268" y="432" font-size="22" fill="#17171A">安静结束</text>
        <text x="268" y="464" font-size="19" fill="#6E6A5E">检查完成，不打扰</text>
        <line x1="510" y1="144" x2="652" y2="144" stroke="#A9A293" stroke-width="1.5" marker-end="url(#a7)"/>
        <text x="664" y="150" font-size="19" fill="#6E6A5E">用户收到</text>
        <line x1="510" y1="290" x2="522" y2="290" stroke="#A9A293" stroke-width="1.5" marker-end="url(#a7)"/>
        <rect x="530" y="242" width="190" height="96" rx="3" fill="#FFFDF8" stroke="#C9C2B1" stroke-width="1.2"/>
        <text x="550" y="286" font-size="20" fill="#17171A">dispatcher</text>
        <text x="550" y="318" font-size="18" fill="#6E6A5E">控制节奏 · 失败重投</text>
        <line x1="720" y1="290" x2="756" y2="290" stroke="#A9A293" stroke-width="1.5" marker-end="url(#a7)"/>
        <text x="768" y="296" font-size="19" fill="#6E6A5E">用户</text>
      </svg>
    </div>
    <div class="note"><strong>把「通知过多」和「漏掉重要变化」都放进评估。</strong>原文建议从较少的通知开始调。</div>
    <div class="rail" aria-label="五个组件进度"><span>收件箱</span><span>定时器</span><span>记忆</span><span>权限</span><span class="on">发件箱</span></div>
    <div class="foot"><span>William Hu · Anthropic《Building always-on agents》</span><span>发件箱与投递</span></div>
  </div>
</article>
</div>
<script>
(function(){
  var card = document.getElementById('xhs-card');
  var W = 1080, H = 1440;
  function fit(){
    var vw = document.documentElement.clientWidth || window.innerWidth;
    var vh = document.documentElement.clientHeight || window.innerHeight;
    var scale = Math.min(vw / W, vh / H);
    card.style.transform = 'scale(' + scale + ')';
  }
  window.addEventListener('resize', fit);
  if (window.ResizeObserver) { new ResizeObserver(fit).observe(document.documentElement); }
  fit();
})();
</script>
</body>
</html>
