<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>事件收件箱</title>

<style>
html,body{margin:0;padding:0;overflow:hidden;background:transparent}
#xhs-card{position:relative;width:1080px;height:1440px;overflow:hidden;transform-origin:top left}
</style>

<style>
body{margin:0;background:#F7F4EE}
.card{position:relative;width:1080px;height:1440px;background:#F7F4EE;color:#17171A;overflow:hidden;font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.card .pad{position:absolute;inset:0;padding:76px 96px 60px 80px;display:flex;flex-direction:column;box-sizing:border-box}
.kick{display:flex;justify-content:space-between;align-items:baseline;font-size:21px;letter-spacing:.16em;color:#6E6A5E}
.kick .b{font-weight:600;color:#17171A;letter-spacing:.10em}
.rule{height:1px;background:#DCD5C6;margin-top:18px;flex:none}
.eyebrow{margin-top:44px;font-size:22px;letter-spacing:.22em;color:#002FA7;font-weight:600}
.h1{margin:18px 0 0;font-family:"Songti SC","STSong","Source Han Serif SC","Noto Serif CJK SC",serif;font-weight:600;font-size:64px;line-height:1.30;letter-spacing:.01em}
.deck{margin:26px 0 0;font-size:30px;line-height:1.76;color:#4E4B45;max-width:850px}
.panel{margin-top:38px;background:#FFFDF8;border:1px solid #DCD5C6;border-radius:3px}
.panel svg{display:block;width:100%;height:auto}
.panel text{font-family:"PingFang SC","Hiragino Sans GB",system-ui,sans-serif}
.note{margin-top:auto;padding-top:30px;font-size:24px;line-height:1.7;color:#6E6A5E}
.note strong{color:#17171A;font-weight:600}
.rail{display:flex;align-items:center;margin-top:18px}
.rail span{flex:1;position:relative;padding-left:16px;font-size:18px;letter-spacing:.06em;color:#B5AE9E}
.rail span::before{content:"";position:absolute;left:0;top:50%;width:5px;height:5px;border-radius:50%;background:#CFC7B6;transform:translateY(-50%)}
.rail span.on{color:#002FA7;font-weight:600}
.rail span.on::before{background:#002FA7;width:7px;height:7px}
.foot{margin-top:22px;padding-top:20px;border-top:1px solid #DCD5C6;display:flex;justify-content:space-between;gap:24px;font-size:19px;color:#8A8578;letter-spacing:.03em}
.mark{position:absolute;top:104px;right:26px;writing-mode:vertical-rl;font-size:13px;letter-spacing:.34em;color:rgba(0,47,167,.20);font-family:"Helvetica Neue",Arial,sans-serif}
</style>

</head>
<body>
<div id="xhs-card">

<article class="card">
  <span class="mark">SOMEONE ONCE SAID</span>
  <div class="pad">
    <div class="kick"><span><span class="b">常驻 AGENT</span> · 架构拆解</span><span>03 / 08</span></div>
    <div class="rule"></div>
    <div class="eyebrow">组件 01 · 事件收件箱</div>
    <h1 class="h1">唤醒只是敲门，<br>要处理的东西在收件箱里</h1>
    <p class="deck">用户消息、Webhook、后台任务结果都先写入持久化收件箱，再由 worker 取出处理。</p>
    <div class="panel">
      <svg viewBox="0 0 904 500" role="img" aria-label="三类事件写入收件箱，由单个 worker 处理并标记完成">
        <defs><marker id="a3" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#A9A293"/></marker></defs>
        <text x="24" y="46" font-size="20" fill="#002FA7">接口先尽快确认收到，较重的检查放到运行阶段。</text>
        <rect x="24" y="96" width="196" height="62" rx="3" fill="#FFFDF8" stroke="#C9C2B1" stroke-width="1.2"/>
        <text x="44" y="134" font-size="22" fill="#17171A">用户消息</text>
        <rect x="24" y="190" width="196" height="62" rx="3" fill="#FFFDF8" stroke="#C9C2B1" stroke-width="1.2"/>
        <text x="44" y="228" font-size="22" fill="#17171A">Webhook</text>
        <rect x="24" y="284" width="196" height="62" rx="3" fill="#FFFDF8" stroke="#C9C2B1" stroke-width="1.2"/>
        <text x="44" y="322" font-size="22" fill="#17171A">任务结果</text>
        <line x1="220" y1="127" x2="286" y2="127" stroke="#A9A293" stroke-width="1.5" marker-end="url(#a3)"/>
        <line x1="220" y1="221" x2="286" y2="221" stroke="#A9A293" stroke-width="1.5" marker-end="url(#a3)"/>
        <line x1="220" y1="315" x2="286" y2="315" stroke="#A9A293" stroke-width="1.5" marker-end="url(#a3)"/>
        <rect x="292" y="76" width="268" height="352" rx="3" fill="#FFFDF8" stroke="#C9C2B1" stroke-width="1.2"/>
        <text x="312" y="116" font-size="23" font-weight="600" fill="#17171A">事件收件箱</text>
        <text x="312" y="146" font-size="19" fill="#8A8578">持久化 · 先落盘</text>
        <rect x="312" y="168" width="228" height="46" rx="2" fill="#E9EDF9" stroke="#002FA7" stroke-width="1.2"/>
        <text x="326" y="197" font-size="19" fill="#1E2B54">evt · webhook</text>
        <rect x="312" y="222" width="228" height="46" rx="2" fill="#F2F0E9" stroke="#D5CEBE" stroke-width="1.2"/>
        <text x="326" y="251" font-size="19" fill="#6E6A5E">evt · 重复来源 → 丢弃</text>
        <rect x="312" y="276" width="228" height="46" rx="2" fill="#E9EDF9" stroke="#002FA7" stroke-width="1.2"/>
        <text x="326" y="305" font-size="19" fill="#1E2B54">evt · 定时器</text>
        <rect x="312" y="330" width="228" height="46" rx="2" fill="#E9EDF9" stroke="#002FA7" stroke-width="1.2"/>
        <text x="326" y="359" font-size="19" fill="#1E2B54">evt · 用户回复</text>
        <text x="312" y="404" font-size="18" fill="#8A8578">按来源 ID 去重；连续消息可合并</text>
        <line x1="560" y1="225" x2="628" y2="225" stroke="#A9A293" stroke-width="1.5" marker-end="url(#a3)"/>
        <rect x="632" y="150" width="248" height="152" rx="3" fill="#FFFDF8" stroke="#C9C2B1" stroke-width="1.2"/>
        <text x="656" y="190" font-size="24" font-weight="600" fill="#17171A">worker</text>
        <text x="656" y="224" font-size="19" fill="#4E4B45">同一时间只让一个活跃，</text>
        <text x="656" y="250" font-size="19" fill="#4E4B45">减少重复执行与相互覆盖</text>
        <text x="656" y="284" font-size="18" fill="#8A8578">取任务 → 跑一次 run</text>
        <line x1="756" y1="302" x2="756" y2="342" stroke="#A9A293" stroke-width="1.5" marker-end="url(#a3)"/>
        <rect x="632" y="346" width="248" height="56" rx="3" fill="#E9EDF9" stroke="#002FA7" stroke-width="1.2"/>
        <text x="656" y="381" font-size="20" fill="#1E2B54">成功 → 标记事件完成</text>
        <path d="M632,414 C560,470 470,470 430,428" fill="none" stroke="#B9B2A2" stroke-width="1.4" stroke-dasharray="5 6"/>
        <text x="470" y="486" font-size="18" fill="#8A8578">中途失败 / 退出：未完成事件仍可被取出</text>
      </svg>
    </div>
    <div class="note"><strong>先落盘，再干活。</strong>唤醒只是提醒有活要干，待处理内容以收件箱为准。</div>
    <div class="rail" aria-label="五个组件进度"><span class="on">收件箱</span><span>定时器</span><span>记忆</span><span>权限</span><span>发件箱</span></div>
    <div class="foot"><span>William Hu · Anthropic《Building always-on agents》</span><span>事件收件箱</span></div>
  </div>
</article>
</div>
<script>
(function(){
  var card = document.getElementById('xhs-card');
  var W = 1080, H = 1440;
  function fit(){
    var vw = document.documentElement.clientWidth || window.innerWidth;
    var vh = document.documentElement.clientHeight || window.innerHeight;
    var scale = Math.min(vw / W, vh / H);
    card.style.transform = 'scale(' + scale + ')';
  }
  window.addEventListener('resize', fit);
  if (window.ResizeObserver) { new ResizeObserver(fit).observe(document.documentElement); }
  fit();
})();
</script>
</body>
</html>
