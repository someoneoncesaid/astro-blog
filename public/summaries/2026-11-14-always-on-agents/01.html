<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>封面</title>

<style>
html,body{margin:0;padding:0;overflow:hidden;background:transparent}
#xhs-card{position:relative;width:1080px;height:1440px;overflow:hidden;transform-origin:top left}
</style>

<style>
body{margin:0;background:#F7F4EE}
.card{position:relative;width:1080px;height:1440px;background:#F7F4EE;color:#17171A;overflow:hidden;font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.card .pad{position:absolute;inset:0;padding:76px 96px 60px 80px;display:flex;flex-direction:column;box-sizing:border-box}
.kick{display:flex;justify-content:space-between;align-items:baseline;font-size:21px;letter-spacing:.16em;color:#6E6A5E}
.kick .b{font-weight:600;color:#17171A;letter-spacing:.10em}
.rule{height:1px;background:#DCD5C6;margin-top:18px;flex:none}
.h1{margin:18px 0 0;font-family:"Songti SC","STSong","Source Han Serif SC","Noto Serif CJK SC",serif;font-weight:600;font-size:64px;line-height:1.30;letter-spacing:.01em}
.h1 em{font-style:normal;color:#002FA7}
.deck{margin:26px 0 0;font-size:30px;line-height:1.76;color:#4E4B45;max-width:850px}
.foot{margin-top:auto;padding-top:20px;border-top:1px solid #DCD5C6;display:flex;justify-content:space-between;gap:24px;font-size:19px;color:#8A8578;letter-spacing:.03em}
.mark{position:absolute;top:104px;right:26px;writing-mode:vertical-rl;font-size:13px;letter-spacing:.34em;color:rgba(0,47,167,.20);font-family:"Helvetica Neue",Arial,sans-serif}
</style>

</head>
<body>
<div id="xhs-card">

<article class="card">
  <span class="mark">SOMEONE ONCE SAID</span>
  <div class="pad">
    <div class="kick"><span><span class="b">常驻 AGENT</span> · 架构拆解</span><span>COVER</span></div>
    <div class="rule"></div>
    <h1 class="h1" style="margin-top:104px;font-size:78px;line-height:1.26">让 Agent <em>一直在线</em><br>靠的不是更长的提示词</h1>
    <p class="deck" style="margin-top:34px;font-size:32px">它平时休眠，有事件才唤醒。每次唤醒是一次 run，接续的是同一个 session。</p>
    <div style="margin:auto 0;display:flex;flex-direction:column;gap:56px">
      <div style="display:flex;gap:10px">
        <span style="background:#FFFDF8;border:1px solid #DCD5C6;padding:12px 15px;font-size:19px;color:#4E4B45;letter-spacing:.02em"><span style="color:#002FA7;font-weight:600">01</span> 收件箱</span>
        <span style="background:#FFFDF8;border:1px solid #DCD5C6;padding:12px 15px;font-size:19px;color:#4E4B45;letter-spacing:.02em"><span style="color:#002FA7;font-weight:600">02</span> 定时器</span>
        <span style="background:#FFFDF8;border:1px solid #DCD5C6;padding:12px 15px;font-size:19px;color:#4E4B45;letter-spacing:.02em"><span style="color:#002FA7;font-weight:600">03</span> 记忆</span>
        <span style="background:#FFFDF8;border:1px solid #DCD5C6;padding:12px 15px;font-size:19px;color:#4E4B45;letter-spacing:.02em"><span style="color:#002FA7;font-weight:600">04</span> 权限</span>
        <span style="background:#FFFDF8;border:1px solid #DCD5C6;padding:12px 15px;font-size:19px;color:#4E4B45;letter-spacing:.02em"><span style="color:#002FA7;font-weight:600">05</span> 发件箱</span>
      </div>
      <div>
        <svg viewBox="0 0 904 240" role="img" aria-label="休眠与运行交替的时间线：四次唤醒">
          <defs><marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#B9B2A2"/></marker></defs>
          <text x="0" y="28" font-size="19" fill="#6E6A5E">休眠，等一个事件</text>
          <text x="904" y="28" font-size="19" fill="#6E6A5E" text-anchor="end">run 结束，回到休眠</text>
          <line x1="0" y1="161" x2="852" y2="161" stroke="#C9C2B1" stroke-width="1.5" stroke-dasharray="5 9"/>
          <line x1="852" y1="161" x2="900" y2="161" stroke="#C9C2B1" stroke-width="1.5" marker-end="url(#arw)"/>
          <text x="96" y="118" font-size="18" fill="#002FA7" text-anchor="middle">唤醒</text>
          <rect x="96" y="129" width="100" height="64" rx="3" fill="#E9EDF9" stroke="#002FA7" stroke-width="1.5"/>
          <text x="146" y="168" font-size="22" fill="#002FA7" text-anchor="middle">run</text>
          <text x="220" y="168" font-size="19" fill="#B3AC9C" text-anchor="middle">· · ·</text>
          <text x="300" y="118" font-size="18" fill="#002FA7" text-anchor="middle">唤醒</text>
          <rect x="300" y="129" width="100" height="64" rx="3" fill="#E9EDF9" stroke="#002FA7" stroke-width="1.5"/>
          <text x="350" y="168" font-size="22" fill="#002FA7" text-anchor="middle">run</text>
          <text x="424" y="168" font-size="19" fill="#B3AC9C" text-anchor="middle">· · ·</text>
          <text x="504" y="118" font-size="18" fill="#002FA7" text-anchor="middle">唤醒</text>
          <rect x="504" y="129" width="100" height="64" rx="3" fill="#E9EDF9" stroke="#002FA7" stroke-width="1.5"/>
          <text x="554" y="168" font-size="22" fill="#002FA7" text-anchor="middle">run</text>
          <text x="628" y="168" font-size="19" fill="#B3AC9C" text-anchor="middle">· · ·</text>
          <text x="708" y="118" font-size="18" fill="#002FA7" text-anchor="middle">唤醒</text>
          <rect x="708" y="129" width="100" height="64" rx="3" fill="#E9EDF9" stroke="#002FA7" stroke-width="1.5"/>
          <text x="758" y="168" font-size="22" fill="#002FA7" text-anchor="middle">run</text>
        </svg>
      </div>
    </div>
    <div class="foot"><span>William Hu · Anthropic《Building always-on agents》</span><span>8 页 · 5 个组件</span></div>
  </div>
</article>
</div>
<script>
(function(){
  var card = document.getElementById('xhs-card');
  var W = 1080, H = 1440;
  function fit(){
    var vw = document.documentElement.clientWidth || window.innerWidth;
    var vh = document.documentElement.clientHeight || window.innerHeight;
    var scale = Math.min(vw / W, vh / H);
    card.style.transform = 'scale(' + scale + ')';
  }
  window.addEventListener('resize', fit);
  if (window.ResizeObserver) { new ResizeObserver(fit).observe(document.documentElement); }
  fit();
})();
</script>
</body>
</html>
