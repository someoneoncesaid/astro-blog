<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 533.333 300" role="img" aria-labelledby="title desc" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif"><title id="title">上下文随运行变化</title><desc id="desc">面积图展示固定上下文、休眠间隔、恢复已有会话、压缩旧记录以及启动新会话。</desc><defs><marker id="black" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto-start-reverse"><path d="M0 0L6 3L0 6Z" fill="#252525"/></marker><marker id="orange" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto-start-reverse"><path d="M0 0L6 3L0 6Z" fill="#df6000"/></marker></defs><rect x="0" y="0" width="534" height="300" rx="0" fill="#fffefd" stroke="none"/><rect x="40" y="182" width="462" height="27" rx="0" fill="#eeece4" stroke="none"/><rect x="40" y="248" width="462" height="28" rx="5" fill="#eeece4" stroke="none"/><path d="M40 29V209H510" fill="none" stroke="#252525" stroke-width="0.8" stroke-dasharray="" marker-end="url(#black)"/><path d="M40 41H502" fill="none" stroke="#77746a" stroke-width="0.75" stroke-dasharray="3 3"/><text x="40" y="23" font-size="9" fill="#66645d" font-weight="400" text-anchor="start">已用上下文</text><text x="502" y="36" font-size="9" fill="#66645d" font-weight="400" text-anchor="end">上下文上限</text><text x="510" y="223" font-size="9" fill="#66645d" font-weight="400" text-anchor="end">时间</text><text x="271" y="199" font-size="9" fill="#252525" font-weight="550" text-anchor="middle">每次运行：系统提示、工具定义、记忆</text><text x="271" y="266" font-size="10" fill="#252525" font-weight="550" text-anchor="middle">持久化状态 · 供后续运行使用</text><g clip-path="url(#segment0)"><path d="M40 182V182L106 145V182Z" fill="#fbede0" stroke="none" stroke-width="0.8" stroke-dasharray=""/><path d="M40 182L106 145" fill="none" stroke="#df6000" stroke-width="1.5" stroke-dasharray=""/></g><clipPath id="segment0"><rect x="40" width="0" height="210"><animate attributeName="width" dur="22s" repeatCount="indefinite" keyTimes="0;1e-05;0.11818181818181818;0.95454545454545