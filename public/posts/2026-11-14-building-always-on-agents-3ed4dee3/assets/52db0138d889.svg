<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 533.333 300" role="img" aria-labelledby="title desc" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif"><title id="title">五个组件的工作闭环</title><desc id="desc">三列架构展示运行的触发、运行依赖与输出。用户回复和到期定时器都可以再次触发运行。</desc><defs><marker id="black" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto-start-reverse"><path d="M0 0L6 3L0 6Z" fill="#252525"/></marker><marker id="orange" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto-start-reverse"><path d="M0 0L6 3L0 6Z" fill="#df6000"/></marker></defs><rect x="0" y="0" width="534" height="300" rx="0" fill="#fffefd" stroke="none"/><rect x="30" y="24" width="83" height="228" rx="5" fill="#eeece4" stroke="none"/><rect x="125" y="24" width="225" height="228" rx="5" fill="#eeece4" stroke="none"/><rect x="362" y="24" width="84" height="228" rx="5" fill="#eeece4" stroke="none"/><text x="71.5" y="39" font-size="8" fill="#252525" font-weight="650" text-anchor="middle">什么触发运行</text><text x="237.5" y="39" font-size="8" fill="#252525" font-weight="650" text-anchor="middle">运行时用到什么</text><text x="404" y="39" font-size="8" fill="#252525" font-weight="650" text-anchor="middle">运行后如何输出</text><rect x="37" y="53" width="68" height="37" rx="3" fill="white" stroke="#ddd8cc"/><text x="71.0" y="75" font-size="10" fill="#df6000" font-weight="650" text-anchor="middle">定时器</text><rect x="37" y="130" width="68" height="37" rx="3" fill="white" stroke="#ddd8cc"/><text x="71.0" y="152" font-size="10" fill="#df6000" font-weight="650" text-anchor="middle">事件收件箱</text><rect x="182" y="130" width="112" height="37" rx="3" fill="white" stroke="#252525"/><text x="238.0" y="146" font-size="10" fill="#252525" font-weight="650" text-anchor="middle">一次运行</text><text x="238.0" y="158" font-size="7" fill="#77746a" font-weight="400" text-anchor="middle">在会话中执行</text><rect x="160" y="208" width="68" height="36" rx="3" fill="white" stroke="#ddd8cc"/><tex