<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" role="img" aria-labelledby="process-structure-title process-structure-desc">
<title id="process-structure-title">DSH Electron 进程结构：可见与不可见分三层</title>
<desc id="process-structure-desc">渲染进程是用户看到的网页；主进程是 Node 层，负责窗口、协议和桌面能力；RunAsNode 子进程承载完整 Web 应用；三层之间只通过 preload 注入、dsh-app:// 协议和生命周期 IPC 沟通。</desc>

<defs>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
  <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
</defs>

<rect width="1000" height="760" fill="#f5f5f5"/>
<g font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <text x="40" y="48" fill="#bf4520" font-size="10" font-family="Geist Mono, monospace" letter-spacing="0.14em">ARCHITECTURE · LAYERED PROCESSES</text>
  <text x="40" y="78" fill="#2d3142" font-size="24" font-weight="600">进程结构：一个Electron 应用其实有三层</text>
  <text x="40" y="106" fill="#4f5d75" font-size="13">同一份代码分布在三个进程；三层通过下面两条通道沟通，不是随意互相访问。</text>

  <!-- Layer 1: 用户看到的渲染进程 -->
  <rect x="40" y="132" width="920" height="130" rx="8" fill="rgba(45,49,66,0.025)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
  <rect x="56" y="124" width="190" height="16" fill="#f5f5f5"/>
  <text x="64" y="136" fill="#4f5d75" font-size="9" font-family="Geist Mono, monospace" letter-spacing="0.14em">1. 用户看到的渲染进程</text>
  <rect x="72" y="176" width="344" height="64" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
  <text x="92" y="198" fill="#2d3142" font-size="13" font-weight="600">renderer 页面（前端熟悉的所在）</text>
  <text x="92" y="222" fill="#4f5d75" font-size="11" font-family="Geist Mono, monospace">index.html · app.js · 插件 · 终端</text>
  <rect x="436" y="176" width="236" height="64" rx="6" fill="#f5f5f5" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
  <text x="452" y="198" fill="#2d3142" font-size="13" font-weight="600">D WebView / browser guest</text>
  <text x="452" y="222" fill="#4f5d75" font-size="11" font-family="Geist Mono, monospace">扩展页 · 设备页 · 外嵌 frame</text>
  <rect x="692" y="176" width="252" height="64" rx="6" fill="#f5f5f5" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
  <text x="710" y="198" fill="#2d3142" font-size="13" font-weight="600">welcome / 更新对话框</text>
  <text x="710" y="222" fill="#4f5d75" font-size="11" font-family="Geist Mono, monospace">shell 直出的独立窗口</text>

  <!-- Layer 2: 主进程 -->
  <rect x="40" y="286" width="920" height="150" rx="8" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
  <rect x="56" y="278" width="210" height="16" fill="#f5f5f5"/>
  <text x="64" y="290" fill="#4f5d75" font-size="9" font-family="Geist Mono, monospace" letter-spacing="0.14em">2. 用户看不见的主进程</text>
  <rect x="72" y="330" width="344" height="76" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
  <text x="92" y="352" fill="#2d3142" font-size="13" font-weight="600">Electron 主进程（main.ts）</text>
  <text x="92" y="372" fill="#4f5d75" font-size="11" font-family="Geist Mono, monospace">窗口 · 菜单 · dsh-app:// 协议</text>
  <text x="92" y="392" fill="#4f5d75" font-size="11" font-family="Geist Mono, monospace">原生对话框 / 文件拖出 / 更新</text>
  <rect x="436" y="330" width="236" height="76" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
  <text x="452" y="352" fill="#2d3142" font-size="13" font-weight="600">preload-app.ts</text>
  <text x="452" y="372" fill="#4f5d75" font-size="11" font-family="Geist Mono, monospace">给页面暴露窄 API</text>
  <text x="452" y="392" fill="#4f5d75" font-size="11" font-family="Geist Mono, monospace">dshDesktop / dshDesktopBoot</text>
  <rect x="692" y="330" width="252" height="76" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
  <text x="710" y="352" fill="#2d3142" font-size="13" font-weight="600">host-process.ts</text>
  <text x="710" y="372" fill="#4f5d75" font-size="11" font-family="Geist Mono, monospace">启动并守护后台子进程</text>
  <text x="710" y="392" fill="#4f5d75" font-size="11" font-family="Geist Mono, monospace">isDesktopHostEvent 守卫</text>
  <text x="72" y="424" fill="#5A6580" font-size="11" font-style="italic">主进程唯一能碰平台能力；页面永远不知道实际端口。</text>

  <!-- Layer 3: 后台服务器 -->
  <rect x="40" y="460" width="920" height="150" rx="8" fill="rgba(191,69,32,0.06)" stroke="#bf4520" stroke-width="1"/>
  <rect x="56" y="452" width="168" height="16" fill="#f5f5f5"/>
  <text x="64" y="464" fill="#bf4520" font-size="9" font-family="Geist Mono, monospace" letter-spacing="0.14em">3. 后台服务器</text>
  <rect x="72" y="504" width="440" height="84" rx="6" fill="#f5f5f5" stroke="#bf4520" stroke-width="1"/>
  <text x="92" y="526" fill="#2d3142" font-size="13" font-weight="600">RunAsNode 子进程</text>
  <text x="92" y="546" fill="#4f5d75" font-size="11" font-family="Geist Mono, monospace">ELECTRON_RUN_AS_NODE = 1</text>
  <text x="92" y="566" fill="#4f5d75" font-size="11" font-family="Geist Mono, monospace">desktop-host/lib/index.js</text>
  <text x="92" y="586" fill="#7A4A00" font-size="11">把 Electron 当 Node 用，用户不装 Node 也能跑</text>
  <rect x="532" y="504" width="412" height="84" rx="6" fill="#f5f5f5" stroke="#bf4520" stroke-width="1"/>
  <text x="552" y="526" fill="#2d3142" font-size="13" font-weight="600">完整 Web composition</text>
  <text x="552" y="546" fill="#4f5d75" font-size="11" font-family="Geist Mono, monospace">runProfile(profile='desktop')</text>
  <text x="552" y="566" fill="#4f5d75" font-size="11" font-family="Geist Mono, monospace">webserver + dsh-web-app bundle</text>
  <text x="552" y="586" fill="#7A4A00" font-size="11">127.0.0.1:0 —— 端口由系统分配</text>

  <rect x="368" y="632" width="264" height="56" rx="6" fill="#f5f5f5" stroke="rgba(45,49,66,0.35)" stroke-width="1"/>
  <text x="384" y="654" fill="#2d3142" font-size="13" font-weight="600">$DSH_HOME/profiles/desktop</text>
  <text x="384" y="674" fill="#4f5d75" font-size="11" font-family="Geist Mono, monospace">插件 · 会话 · 凭据 · PID 锁</text>

  <!-- 通道 1: 生命周期 IPC -->
  <rect x="60" y="706" width="880" height="42" rx="6" fill="#FFFFFF" stroke="#B9C2CE"/>
  <text x="76" y="728" fill="#2d3142" font-size="12" font-weight="600">通道 A：生命周期 IPC（start / ready / fatal / platform-session）</text>
  <text x="76" y="744" fill="#4f5d75" font-size="11">Host → Shell 逐条守卫校验，协议外事件 SIGTERM 子进程</text>

  <!-- 通道 2: dsh-app:// 转发 -->
  <rect x="60" y="706" width="880" height="0" rx="0" fill="none"/>
  <!-- channel marker for layer interactions -->
  <line x1="980" y1="132" x2="980" y2="632" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4"/>
  <text x="988" y="400" fill="#4f5d75" font-size="10" font-family="Geist Mono, monospace" transform="rotate(90 988 400)" letter-spacing="0.14em">PRELOAD IN</text>
</g>
</svg>
